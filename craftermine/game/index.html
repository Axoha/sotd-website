.carousel {

.carousel-slide {
  position: absolute;
  top: 0;
  left: 0;
  width: 100%;
  height: 100%;
  object-fit: cover;
  opacity: 0;
  transition: opacity 0.6s ease-in-out;
}
.carousel-slide.active {
  opacity: 1;
}
.carousel-btn {
  position: absolute;
  top: 50%;

.carousel-btn.next {

  function formatNumber(num) {
    return num.toLocaleString('en-US');
  }

  function updateCounters() {
    registered += Math.random() < 0.1 ? Math.floor(Math.random() * 20) + 5 : Math.floor(Math.random() * 3) + 1;
    if (Math.random() < 0.4) {
      playing += Math.random() < 0.5 ? 1 : -1;
    }

    document.getElementById('registered-count').textContent = formatNumber(registered);
    document.getElementById('playing-count').textContent = formatNumber(playing);
  }

  setInterval(updateCounters, 2000);

  function timeAgo(dateString) {
    const posted = new Date(dateString);
    const now = new Date();
    const diffMs = now - posted;

    const seconds = Math.floor(diffMs / 1000);
    const minutes = Math.floor(seconds / 60);
    const hours = Math.floor(minutes / 60);
    const days = Math.floor(hours / 24);
    const months = Math.floor(days / 30);
    const years = Math.floor(days / 365);

    if (years > 0) return years + (years === 1 ? " year ago" : " years ago");
    if (months > 0) return months + (months === 1 ? " month ago" : " months ago");
    if (days > 0) return days + (days === 1 ? " day ago" : " days ago");
    if (hours > 0) return hours + (hours === 1 ? " hour ago" : " hours ago");
    if (minutes > 0) return minutes + (minutes === 1 ? " minute ago" : " minutes ago");
    return "just now";
  }

  function updateAllTimestamps() {
    document.querySelectorAll('.post-date').forEach(el => {
      const posted = el.getAttribute('data-posted');
      el.textContent = timeAgo(posted);
    });

    dot.classList.add('dot');
    if (index === 0) dot.classList.add('active');
    dot.addEventListener('click', () => goToSlide(index));
    dotsContainer.appendChild(dot);
  });

  const dots = document.querySelectorAll('.dot');


  function showSlide(index) {
    slides.forEach(slide => slide.classList.remove('active'));
    dots.forEach(dot => dot.classList.remove('active'));

    slides[index].classList.add('active');
    dots[index].classList.add('active');
    currentSlide = index;
  }

  function changeSlide(direction) {
    let newIndex = currentSlide + direction;
    if (newIndex < 0) newIndex = slides.length - 1;
    if (newIndex >= slides.length) newIndex = 0;
    showSlide(newIndex);
  }

const usernameColors = {};
const colorPalette = ["#55FFFF", "#FF5555", "#55FF55", "#FFFF55", "#FF55FF", "#5555FF", "#FFAA00"];

function getUsernameColor(username) {
  if (!usernameColors[username]) {
    const color = colorPalette[Object.keys(usernameColors).length % colorPalette.length];
    usernameColors[username] = color;
  }
  return usernameColors[username];
}

function addLine(el) {
  chatBox.appendChild(el);

  while (chatBox.children.length > 8) {
    chatBox.removeChild(chatBox.firstChild);
  }

  setTimeout(() => {
    el.classList.add('fade');
  }, 12000);
}

function addChatMessage() {
  const username = usernames[Math.floor(Math.random() * usernames.length)];
  const message = messages[Math.floor(Math.random() * messages.length)];

  const line = document.createElement('div');
  line.classList.add('chat-line');

  const usernameSpan = document.createElement('span');
  usernameSpan.classList.add('chat-username');
  usernameSpan.textContent = `<${username}> `;

  line.appendChild(usernameSpan);
  line.appendChild(document.createTextNode(message));

  addLine(line);
}

function addSystemMessage(username, action) {
  const line = document.createElement('div');
  line.classList.add('chat-line', 'chat-system');
  line.textContent = `${username} ${action} the game`;
  addLine(line);
}

function randomEvent() {
  const username = usernames[Math.floor(Math.random() * usernames.length)];
  const roll = Math.random();

  if (roll < 0.12) {
    addSystemMessage(username, "joined");
  } else if (roll < 0.20) {
    addSystemMessage(username, "left");
  } else if (roll < 0.30) {
    addDeathMessage();
  } else {
    addChatMessage();
  }
}

function scheduleNextMessage() {
  const delay = Math.random() * 1500 + 1000;
  setTimeout(() => {
    randomEvent();
    scheduleNextMessage();
  }, delay);
}

scheduleNextMessage();

const deathMessages = [
  "{player} was slain by a zombie",
  "{player} was shot by a skeleton",
  "{player} fell from a high place",
  "{player} tried to swim in lava",
  "{player} was blown up by a creeper",
  "{player} walked into a cactus while trying to escape a phantom",
  "{player} was pricked to death",
  "{player} drowned",

  "{player} went off with a bang",
  "{player} didn't want to live in the same world as {other}",
  "{player} was killed by {other}"
];

function addDeathMessage() {
  const player = usernames[Math.floor(Math.random() * usernames.length)];
  let other = usernames[Math.floor(Math.random() * usernames.length)];
  while (other === player) {
    other = usernames[Math.floor(Math.random() * usernames.length)];
  }

  const template = deathMessages[Math.floor(Math.random() * deathMessages.length)];
  const text = template.replace('{player}', player).replace('{other}', other);

  const line = document.createElement('div');
  line.classList.add('chat-line', 'chat-death');
  line.textContent = text;

  addLine(line);
}
